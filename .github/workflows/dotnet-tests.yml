name: ".NET Tests"

"on":
  pull_request:
    branches:
      - develop
    paths:
      - "src/dotnet/**"
      - ".github/workflows/dotnet-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "src/dotnet/**"
      - ".github/workflows/dotnet-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-tests:
    name: "Restore, build, and test .NET solution"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carbonops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carbonops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: src/dotnet

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup .NET 8"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Restore"
        run: dotnet restore CarbonOps.Api.sln

      - name: "Build"
        run: dotnet build CarbonOps.Api.sln --no-restore

      - name: "Test"
        env:
          CARBONOPS_POSTGRESQL_TEST_DSN: Host=localhost;Port=5432;Database=carbonops_test;Username=postgres;Password=postgres;SSL Mode=Disable
        run: dotnet test CarbonOps.Api.sln --no-restore --no-build --verbosity normal
