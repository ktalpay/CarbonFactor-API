[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carbonfactor-api"
version = "0.1.0"
description = "CarbonFactor API contract foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
